name: Generate Resume PDFs

on:
  push:
    branches: [ main ]
    paths:
      - 'curriculum/**.md'
      - 'scripts/**'
      - '.github/workflows/generate-pdf.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate PDFs
        run: npm run build:pdf

      - name: Commit and push updated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(curriculum): update resume PDFs [skip ci]"
          file_pattern: "curriculum/*.pdf package-lock.json"

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resumes-pdf
          path: |
            curriculum/resume.pdf
            curriculum/curriculo_pt.pdf
